<template>
    <lightning-card title="Displaying Top 10 Accounts based on Annual Revenue" icon-name="standard:account">
    <div class="slds-var-p-around_small">
        <div class="slds-text-heading_small">
            <template lwc:if={accountsdata}>
                <lightning-datatable key-field="id" data={accountsdata} columns={accColumns}
                max-row-selection="1" onrowselection={handleRowSelection}>
            </lightning-datatable>
            </template>
        </div>
    </div>
     
            <template lwc:if={hasOpportunities}>
                <div class="slds-var-p-around_medium">
        <div class="slds-text-heading_medium">Top 5 Opportunities By Amount:{selectedAccountName}<br></div>
                <lightning-datatable key-field="id" data={oppsdata} columns={oppColumns}>

                </lightning-datatable>
           
            </div>
            
             </template>

</lightning-card>
</template>
